name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build package and example (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | tail -1)"
      - name: Build the Swift package
        run: xcodebuild -scheme YatmoSDK -destination 'generic/platform=iOS Simulator' -derivedDataPath .dd build | xcpretty || xcodebuild -scheme YatmoSDK -destination 'generic/platform=iOS Simulator' -derivedDataPath .dd build
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the example app
        working-directory: Example
        run: |
          printf 'let yatmoTestLicenseKey = "%s"\n' "${{ secrets.YATMO_TEST_LICENSE_KEY }}" > Sources/LicenseKey.local.swift
          xcodegen generate
          xcodebuild -project YatmoExample.xcodeproj -scheme YatmoExample -destination 'generic/platform=iOS Simulator' -derivedDataPath ../.dd CODE_SIGNING_ALLOWED=NO build
